<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Doctoralaser — Sitio en mantenimiento</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0f2540 0%, #1a3a5c 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 480px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    opacity: 0.9;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    color: rgba(255,255,255,0.75);
    margin-bottom: 8px;
  }
  .divider {
    width: 40px;
    height: 2px;
    background: rgba(255,255,255,0.3);
    margin: 24px auto;
  }
  .contact {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
  }
  .contact a {
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v3m0 12v3m9-9h-3M6 12H3m15.36-6.36l-2.12 2.12M7.76 16.24l-2.12 2.12m12.72 0l-2.12-2.12M7.76 7.76L5.64 5.64" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="5"/>
    </svg>
    <h1>Estamos actualizando el sitio</h1>
    <p>Doctoralaser está realizando mejoras y volverá a estar disponible en breve.</p>
    <div class="divider"></div>
    <p class="contact">
      Si necesitas agendar una cita, escríbenos a<br>
      <a href="mailto:info@doctoralaser.com">info@doctoralaser.com</a>
    </p>
  </div>
</body>
</html>
